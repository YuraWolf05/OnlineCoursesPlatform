{% extends "base.html" %}
{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block content %}
<section class="auth">
  <div class="auth-card">
    <h1>Вхід</h1>
    <p class="muted">Використай демо-акаунти або свої, якщо додаси їх у БД.</p>

    <form method="post" class="form">
      <div class="field">
        <label>Email</label>
        <input name="email" placeholder="@gmail.com" required>
      </div>
      <div class="field">
        <label>Пароль</label>
        <input type="password" name="password" placeholder="password" required>
      </div>

      <button class="btn btn-primary" type="submit" style="max-width:70px; font-size:14px;">Увійти</button>
      <div class="muted" style="margin-top:12px">
        Нема акаунта? <a href="{{ url_for('register') }}">Реєстрація</a>
      </div>
    </form>

    <div class="hint">
      <div class="chip">teacher@mail.com / 1234</div>
      <div class="chip">student@mail.com / 1234</div>
    </div>
  </div>
</section>
{% endblock %}
